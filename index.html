<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Библия">
  <meta name="theme-color" content="#000000" id="theme-color-meta">
  <title>Библия</title>
  <link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --bg2: #111111;
      --bg3: #1c1c1c;
      --bg4: #252525;
      --border: #2a2a2a;
      --text: #ebebeb;
      --text2: #888;
      --gold: #c9a84c;
      --tab-h: 48px;
      --bar-h: 52px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }
    [data-theme="light"] {
      --bg: #ffffff;
      --bg2: #f5f5f5;
      --bg3: #ebebeb;
      --bg4: #dedede;
      --border: #d0d0d0;
      --text: #1a1a1a;
      --text2: #666;
      --gold: #9a6f20;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; }

    /* ── TOP BAR ── */
    #top-bar {
      position: fixed; top: 0; left: 0; right: 0;
      height: calc(var(--bar-h) + var(--safe-top));
      padding-top: var(--safe-top);
      background: rgba(0,0,0,0.72);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      backdrop-filter: blur(18px) saturate(180%);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center; padding-left: 10px; padding-right: 6px;
      z-index: 100; gap: 6px;
      transform: translateY(0);
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    #top-bar.bar-hidden { transform: translateY(-100%); }
    [data-theme="light"] #top-bar {
      background: rgba(255,255,255,0.78);
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    #ch-progress {
      position: absolute; bottom: -1px; left: 0;
      height: 2px; background: var(--gold); width: 0;
      transition: width .15s linear; pointer-events: none;
    }
    #bk-btn {
      flex: 1; min-width: 0;
      display: flex; align-items: center; gap: 6px;
      background: var(--bg3); border: none; border-radius: 10px;
      padding: 8px 12px; cursor: pointer;
    }
    #bk-btn span {
      color: var(--text); font-size: 15px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #bk-btn svg { flex-shrink: 0; color: var(--text2); }
    #trans-btn {
      flex-shrink: 0; background: var(--bg3); border: none; border-radius: 8px;
      padding: 8px 10px; color: var(--text); font-size: 13px; font-weight: 700;
      cursor: pointer; letter-spacing: 0.5px;
    }
    .tib {
      flex-shrink: 0; background: none; border: none;
      color: var(--text2); padding: 8px 5px; cursor: pointer;
      display: flex; align-items: center;
    }
    .tib svg { width: 22px; height: 22px; }

    /* ── READING TABS BAR ── */
    #tabs-bar {
      position: fixed;
      top: calc(var(--bar-h) + var(--safe-top));
      left: 0; right: 0;
      height: 36px;
      background: rgba(0,0,0,0.72);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      backdrop-filter: blur(18px) saturate(180%);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      z-index: 99;
      display: none;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    #tabs-bar::-webkit-scrollbar { display: none; }
    #tabs-bar.show { display: flex; align-items: center; }
    #tabs-bar.bar-hidden { transform: translateY(calc(-100% - var(--bar-h) - var(--safe-top))); }
    [data-theme="light"] #tabs-bar {
      background: rgba(255,255,255,0.78);
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    #tabs-bar-inner {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 10px; height: 100%;
    }
    .tab-chip {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 6px;
      background: var(--bg3); border: 1px solid transparent;
      border-radius: 14px; padding: 5px 8px 5px 11px;
      cursor: pointer; font-size: 12px; color: var(--text2);
      max-width: 160px;
    }
    .tab-chip.active {
      background: var(--bg4); color: var(--text);
      border-color: var(--gold);
    }
    .tab-chip-label {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 110px;
    }
    .tab-chip-close {
      background: none; border: none; color: var(--text2);
      padding: 0 2px; cursor: pointer; font-size: 14px;
      line-height: 1; display: flex; align-items: center;
    }
    .tab-chip.active .tab-chip-close { color: var(--text); }
    .tab-add {
      flex-shrink: 0;
      width: 28px; height: 24px;
      background: var(--bg3); border: none; border-radius: 12px;
      color: var(--text2); font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }
    .tab-add:disabled { opacity: 0.3; cursor: default; }

    /* ── SCREENS ── */
    .screen {
      position: fixed;
      top: calc(var(--bar-h) + var(--safe-top));
      bottom: 0;
      left: 0; right: 0;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      display: none;
      transition: top 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    .screen.active { display: block; }
    .screen.bar-hidden { top: var(--safe-top); }
    .screen.with-tabs { top: calc(var(--bar-h) + var(--safe-top) + 36px); }
    .screen.with-tabs.bar-hidden { top: var(--safe-top); }
    .screen.font-shift { top: calc(var(--bar-h) + var(--safe-top) + 96px); }
    .screen.font-shift.bar-hidden { top: var(--safe-top); }

    /* ── READER SCREEN ── */
    #screen-bible { padding: 20px 20px calc(var(--tab-h) + var(--safe-bot) + 30px); }
    #loading-msg {
      display: none; text-align: center;
      padding: 80px 20px; color: var(--text2); font-size: 15px;
    }
    #error-msg {
      display: none; text-align: center;
      padding: 80px 20px; color: #f55; font-size: 15px; line-height: 1.6;
    }
    #ch-text {
      font-family: 'PT Serif', Georgia, serif;
      font-size: 21px; line-height: 1.85;
      color: var(--text); text-align: justify;
      --pg-space: 0px;
    }
    .verse { display: inline; border-radius: 3px; margin-right: var(--pg-space); }
    .verse sup {
      color: var(--gold); font-size: 11px; font-weight: 700;
      font-family: -apple-system, sans-serif;
      vertical-align: super; line-height: 0;
      margin-right: 1px; margin-left: 3px;
    }
    /* ── VERSE SELECTION + HIGHLIGHT SYSTEM ── */
    .verse.sel {
      background: rgba(201,168,76,0.35);
      border-radius: 3px;
    }
    .hld { border-radius: 3px; }

    /* ── VERSE ACTION SHEET (no overlay - keep verse taps active) ── */
    #va {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--bg2); border-radius: 18px 18px 0 0;
      z-index: 301; padding-bottom: var(--safe-bot);
      transform: translateY(100%); transition: transform .28s cubic-bezier(.4,0,.2,1);
      overflow: hidden;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.3);
    }
    #va.open { transform: none; }
    #va-ref-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px 6px;
    }
    #va-ref { font-size: 13px; color: var(--text2); }
    #va-count {
      font-size: 12px; color: var(--gold); font-weight: 600;
      background: rgba(201,168,76,0.15); padding: 2px 8px;
      border-radius: 10px; display: none;
    }
    /* Horizontal slider */
    #va-slider-wrap {
      overflow-x: scroll; overflow-y: hidden;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    #va-slider-wrap::-webkit-scrollbar { display: none; }
    #va-slider-track { display: flex; width: 200%; }
    .va-panel { width: 50%; flex-shrink: 0; scroll-snap-align: start; }
    /* Panel 1 colors row */
    #hl-colors-row {
      display: flex; align-items: center;
      padding: 8px 14px; gap: 10px; overflow-x: auto;
      scrollbar-width: none;
    }
    #hl-colors-row::-webkit-scrollbar { display: none; }
    .hl-dot {
      width: 32px; height: 32px; border-radius: 50%; border: none;
      cursor: pointer; flex-shrink: 0;
      transition: transform .15s, box-shadow .15s;
    }
    .hl-dot.on { box-shadow: 0 0 0 3px var(--bg2), 0 0 0 5px var(--text); transform: scale(1.15); }
    .hl-pick-btn {
      width: 32px; height: 32px; border-radius: 50%; border: 2px dashed var(--text2);
      background: none; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--text2); font-size: 18px; line-height: 1;
    }
    #hl-clr-row {
      display: flex; align-items: center; justify-content: flex-end;
      padding: 0 14px 6px;
    }
    .hl-clr {
      background: var(--bg4); border: none; border-radius: 20px;
      padding: 6px 14px; color: var(--text2); font-size: 13px; cursor: pointer;
    }
    .va-btns { display: flex; gap: 8px; padding: 6px 14px 16px; }
    .va-btn {
      flex: 1; background: var(--bg3); border: none; border-radius: 12px;
      padding: 12px 6px; color: var(--text); font-size: 12px;
      cursor: pointer; display: flex; flex-direction: column;
      align-items: center; gap: 5px;
    }
    .va-btn svg { width: 20px; height: 20px; color: var(--text2); }
    /* Page dots */
    #va-page-dots {
      display: flex; justify-content: center; gap: 5px; padding: 4px 0 8px;
    }
    .va-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--text2); opacity: 0.3;
      transition: opacity .2s, background .2s;
    }
    .va-dot.on { background: var(--gold); opacity: 1; }
    /* Panel 2 color picker */
    #va-p2 { padding: 6px 14px 10px; }
    #cp-back {
      background: none; border: none; color: var(--gold);
      font-size: 14px; cursor: pointer; padding: 2px 0 8px;
      display: flex; align-items: center; gap: 4px;
    }
    #cp-canvas {
      width: 100%; border-radius: 10px; display: block;
      cursor: crosshair; touch-action: none;
    }
    #cp-hue {
      width: 100%; height: 22px; border-radius: 8px; display: block;
      margin-top: 10px; cursor: pointer; touch-action: none;
    }
    #cp-bottom {
      display: flex; align-items: center; gap: 12px; margin-top: 12px;
    }
    #cp-swatch {
      width: 40px; height: 40px; border-radius: 10px;
      border: 2px solid var(--border); flex-shrink: 0;
    }
    #cp-apply {
      flex: 1; background: var(--gold); border: none; border-radius: 12px;
      padding: 12px; color: #000; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    #ch-nav {
      display: flex; justify-content: space-between;
      padding: 24px 0 8px; margin-top: 8px;
      border-top: 1px solid var(--border);
    }
    .ch-arr {
      background: none; border: none;
      display: flex; align-items: center; gap: 6px;
      color: var(--text2); font-size: 14px; cursor: pointer;
      padding: 8px 4px;
    }
    .ch-arr:disabled { opacity: 0.2; cursor: default; }
    .ch-arr svg { width: 18px; height: 18px; }

    /* font size + alignment control */
    #font-bar {
      display: none; position: fixed;
      top: calc(var(--bar-h) + var(--safe-top));
      left: 0; right: 0;
      max-height: calc(100vh - var(--bar-h) - var(--safe-top) - var(--tab-h) - var(--safe-bot) - 20px);
      background: var(--bg2); border-bottom: 1px solid var(--border);
      padding: 10px 20px 12px; z-index: 90;
      flex-direction: column; gap: 10px;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    #font-bar.open { display: flex; }
    #font-size-row { display: flex; align-items: center; gap: 12px; }
    #font-bar span { color: var(--text2); font-size: 13px; min-width: 70px; }
    #font-range { flex: 1; accent-color: var(--gold); }
    #font-close {
      background: none; border: none; color: var(--text2);
      font-size: 20px; cursor: pointer; padding: 0 4px;
    }
    #align-row {
      display: flex; gap: 8px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
    .al-btn {
      flex: 1; background: var(--bg3); border: 1px solid transparent;
      border-radius: 10px; padding: 9px 4px;
      color: var(--text2); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      gap: 6px; font-size: 13px;
    }
    .al-btn.on { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.1); }
    .al-btn svg { width: 18px; height: 18px; }
    /* advanced settings */
    #adv-toggle {
      background: none; border: none;
      display: flex; align-items: center; justify-content: center;
      gap: 6px; padding: 8px 0; cursor: pointer;
      color: var(--text2); font-size: 13px;
      border-top: 1px solid var(--border);
    }
    #adv-toggle svg { width: 14px; height: 14px; transition: transform .2s; }
    #adv-toggle.open svg { transform: rotate(180deg); }
    #adv-rows {
      display: none; flex-direction: column; gap: 12px;
      padding-top: 6px; border-top: 1px solid var(--border);
    }
    #adv-rows.open { display: flex; }
    .adv-row { display: flex; align-items: center; gap: 12px; }
    .adv-lbl {
      font-size: 12px; color: var(--text2);
      min-width: 92px; flex-shrink: 0;
    }
    .adv-val {
      font-size: 12px; color: var(--text); font-weight: 600;
      min-width: 40px; text-align: right;
    }
    .adv-row input[type="range"] { flex: 1; accent-color: var(--gold); }
    .adv-reset {
      background: var(--bg3); border: none; border-radius: 8px;
      padding: 7px 14px; color: var(--text2); font-size: 12px;
      cursor: pointer; margin-top: 4px; align-self: center;
    }

    /* ── PLACEHOLDER SCREENS ── */
    .placeholder {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; gap: 12px;
      color: var(--text2);
    }
    .placeholder svg { width: 48px; height: 48px; opacity: 0.3; }
    .placeholder p { font-size: 16px; }

    /* ── SEARCH SCREEN ── */
    #screen-search { padding: 16px 16px calc(var(--tab-h) + var(--safe-bot) + 30px); }
    #search-wrap {
      display: flex; gap: 10px; align-items: center;
      margin-bottom: 16px;
    }
    #search-input {
      flex: 1; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 14px;
      color: var(--text); font-size: 16px; outline: none;
    }
    #search-input::placeholder { color: var(--text2); }
    #search-go {
      background: var(--gold); border: none; border-radius: 10px;
      padding: 10px 16px; color: #000; font-size: 14px;
      font-weight: 700; cursor: pointer;
    }
    #search-results { }
    .s-result {
      background: var(--bg3); border-radius: 10px;
      padding: 12px 14px; margin-bottom: 10px; cursor: pointer;
    }
    .s-result-ref { color: var(--gold); font-size: 13px; font-weight: 700; margin-bottom: 4px; }
    .s-result-text { font-family: 'PT Serif', Georgia, serif; font-size: 16px; line-height: 1.5; }
    .s-result-text em { background: rgba(201,168,76,0.3); font-style: normal; border-radius: 2px; }
    #search-hint { color: var(--text2); font-size: 14px; text-align: center; padding: 40px 20px; }

    /* ── SAVED SCREEN ── */
    #screen-saved { padding: 16px 16px calc(var(--tab-h) + var(--safe-bot) + 30px); }
    .saved-item {
      background: var(--bg3); border-radius: 10px;
      padding: 12px 14px; margin-bottom: 10px;
      position: relative;
    }
    .saved-ref { color: var(--gold); font-size: 13px; font-weight: 700; margin-bottom: 4px; }
    .saved-text { font-family: 'PT Serif', Georgia, serif; font-size: 16px; line-height: 1.5; }
    .saved-del {
      position: absolute; top: 10px; right: 10px;
      background: none; border: none; color: var(--text2);
      font-size: 18px; cursor: pointer; padding: 2px 6px;
    }
    #saved-empty { color: var(--text2); text-align: center; padding: 60px 20px; font-size: 15px; }

    /* ── BOTTOM NAV ── */
    #bot-nav {
      position: fixed;
      bottom: calc(var(--safe-bot) + 10px);
      left: 12px; right: 12px;
      height: var(--tab-h);
      background: rgba(28,28,28,0.78);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      display: flex; z-index: 100;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1),
                  opacity 0.3s ease;
    }
    [data-theme="light"] #bot-nav {
      background: rgba(245,245,245,0.85);
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
    }
    #bot-nav.nav-hidden {
      transform: translateY(calc(100% + 20px));
      opacity: 0;
    }
    .nav-tab {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px;
      background: none; border: none; cursor: pointer;
      color: var(--text2); font-size: 9px; padding: 3px 0;
      transition: color .2s;
      border-radius: 999px;
    }
    .nav-tab.on { color: var(--text); }
    .nav-tab svg { width: 20px; height: 20px; }

    /* ── MODALS (sheet from bottom) ── */
    .ov {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.65); z-index: 200;
      flex-direction: column; justify-content: flex-end;
    }
    [data-theme="light"] .ov { background: rgba(0,0,0,.35); }
    .ov.open { display: flex; }
    .sheet {
      background: var(--bg2); border-radius: 18px 18px 0 0;
      max-height: 88vh; display: flex; flex-direction: column;
      padding-bottom: var(--safe-bot);
    }
    .handle {
      width: 38px; height: 4px; background: var(--bg4);
      border-radius: 2px; margin: 12px auto 6px; flex-shrink: 0;
    }
    .sh-title {
      font-size: 13px; color: var(--text2);
      text-align: center; padding: 4px 16px 10px; flex-shrink: 0;
    }
    .sh-search {
      margin: 0 14px 10px; background: var(--bg3);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 9px 13px; color: var(--text); font-size: 15px;
      outline: none; flex-shrink: 0;
    }
    .sh-scroll {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
      overscroll-behavior: contain;
    }
    body.modal-open { overflow: hidden; position: fixed; width: 100%; }

    /* swipe-to-dismiss visual feedback */
    .sheet { transition: transform 0.2s ease; }

    /* Book list */
    .test-lbl {
      font-size: 10px; font-weight: 800; color: var(--text2);
      letter-spacing: 1.2px; text-transform: uppercase;
      padding: 12px 16px 5px;
    }
    .bk-item {
      display: flex; align-items: center;
      width: 100%; text-align: left;
      background: none; border: none; border-bottom: 1px solid var(--border);
      color: var(--text); font-size: 17px; padding: 11px 16px;
      cursor: pointer; gap: 10px;
    }
    .bk-item.cur { color: var(--gold); }
    .bk-item:active { background: var(--bg3); }
    .bk-name { flex: 1; }
    .bk-chs { color: var(--text2); font-size: 15px; min-width: 28px; text-align: right; }
    .bk-ring { flex-shrink: 0; position: relative; width: 38px; height: 38px; }
    .bk-ring svg { width: 38px; height: 38px; transform: rotate(-90deg); }
    .bk-ring-track { fill: none; stroke: var(--bg4); stroke-width: 3; }
    .bk-ring-fill  { fill: none; stroke: var(--gold); stroke-width: 3;
                     stroke-linecap: round;
                     transition: stroke-dashoffset .4s; }
    .bk-ring-lbl {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; color: var(--text2); font-weight: 600;
    }
    .bk-ring-lbl.done { color: var(--gold); font-size: 13px; }
    /* read chapters in grid */
    .cg-item.rd { opacity: .45; }

    /* Chapter grid */
    .cg {
      display: grid; grid-template-columns: repeat(6, 1fr);
      gap: 8px; padding: 10px 14px 16px; align-content: start;
    }
    .cg-item {
      aspect-ratio: 1; display: flex; align-items: center;
      justify-content: center; background: var(--bg3);
      border: none; border-radius: 10px;
      color: var(--text); font-size: 17px; cursor: pointer;
    }
    .cg-item.cur { background: var(--gold); color: #000; font-weight: 700; }
    .cg-item:active { opacity: .6; }

    /* Translation list */
    .tr-item {
      display: flex; align-items: center; justify-content: space-between;
      background: none; border: none; width: 100%;
      border-bottom: 1px solid var(--border);
      padding: 14px 16px; cursor: pointer; color: var(--text);
    }

function hexToRgba(hex, a) {
  if (!hex || hex.length < 7) return 'transparent';
  var r = parseInt(hex.slice(1,3),16);
  var g = parseInt(hex.slice(3,5),16);
  var b = parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}
function hsvToHex(h, s, v) {
  var r, g, b, i = Math.floor(h * 6), f = h * 6 - i;
  var p = v*(1-s), q = v*(1-f*s), t = v*(1-(1-f)*s);
  switch(i % 6) {
    case 0: r=v; g=t; b=p; break; case 1: r=q; g=v; b=p; break;
    case 2: r=p; g=v; b=t; break; case 3: r=p; g=q; b=v; break;
    case 4: r=t; g=p; b=v; break; default: r=v; g=p; b=q;
  }
  var toH = function(n) { return Math.round(n*255).toString(16).padStart(2,'0'); };
  return '#' + toH(r) + toH(g) + toH(b);
}

function cacheKey(tr, bi, ch) { return "bbl_c_" + tr + "_" + bi + "_" + ch; }
function getCache(tr, bi, ch) {
  try {
    var d = localStorage.getItem(cacheKey(tr, bi, ch));
    if (d) return JSON.parse(d);
  } catch(e) {}
  return null;
}
function setCache(tr, bi, ch, data) {
  try { localStorage.setItem(cacheKey(tr, bi, ch), JSON.stringify(data)); } catch(e) {}
}

function updateBar() {
  document.getElementById("bk-label").textContent = bkName(S.bi) + " " + S.ch;
  var tr = null;
  for (var i = 0; i < TRANS.length; i++) {
    if (TRANS[i].code === S.tr) { tr = TRANS[i]; break; }
  }
  if (tr) document.getElementById("trans-btn").textContent = tr.lbl;

  // Prev/next labels
  var pb = document.getElementById("prev-btn");
  var nb = document.getElementById("next-btn");
  var pl = document.getElementById("prev-lbl");
  var nl = document.getElementById("next-lbl");
  var isFirst = S.bi === 0 && S.ch === 1;
  var isLast  = S.bi === BOOKS.length - 1 && S.ch === bkChs(S.bi);
  pb.disabled = isFirst;
  nb.disabled = isLast;
  if (!isFirst) {
    if (S.ch > 1) pl.textContent = bkName(S.bi) + " " + (S.ch - 1);
    else { var pi = S.bi - 1; pl.textContent = bkName(pi) + " " + bkChs(pi); }
  } else { pl.textContent = ""; }
  if (!isLast) {
    if (S.ch < bkChs(S.bi)) nl.textContent = bkName(S.bi) + " " + (S.ch + 1);
    else nl.textContent = bkName(S.bi + 1) + " 1";
  } else { nl.textContent = ""; }
}

// ═══════════════════════════════════════════════
function renderTabsBar() {
  var bar = document.getElementById("tabs-bar");
  var inner = document.getElementById("tabs-bar-inner");
  var screens = document.querySelectorAll(".screen");

  // Hide bar entirely if only 1 tab
  if (TABS_R.length <= 1) {
    bar.classList.remove("show");
    for (var s = 0; s < screens.length; s++) screens[s].classList.remove("with-tabs");
    return;
  }
  bar.classList.add("show");
  for (var s2 = 0; s2 < screens.length; s2++) screens[s2].classList.add("with-tabs");

  var html = "";
  for (var i = 0; i < TABS_R.length; i++) {
    var t = TABS_R[i];
    var isEnTab = t.tr === "NIV" || t.tr === "NLT";
    var name = isEnTab ? BOOKS_EN[t.bi] : BOOKS[t.bi][0];
    var label = name + " " + t.ch;
    var trLbl = "";
    for (var ti = 0; ti < TRANS.length; ti++) if (TRANS[ti].code === t.tr) trLbl = TRANS[ti].lbl;
    html += '<div class="tab-chip' + (i === ACTIVE_TAB ? " active" : "") + '" onclick="switchTab(' + i + ')">' +
            '<span class="tab-chip-label">' + esc(label) + ' · ' + esc(trLbl) + '</span>' +
            '<button class="tab-chip-close" onclick="event.stopPropagation();closeTab(' + i + ')">\u00D7</button>' +
            '</div>';
  }
  // Add button
  var disabled = TABS_R.length >= MAX_TABS ? " disabled" : "";
  html += '<button class="tab-add" onclick="newReadingTab()"' + disabled + '>+</button>';
  inner.innerHTML = html;

  // Scroll active into view
  setTimeout(function() {
    var active = inner.querySelector(".tab-chip.active");
    if (active && active.scrollIntoView) {
      active.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
    }
  }, 50);
}

function newReadingTab() {
  if (TABS_R.length >= MAX_TABS) {
    showToast("\u041c\u0430\u043a\u0441\u0438\u043c\u0443\u043c 3 \u0432\u043a\u043b\u0430\u0434\u043a\u0438");
    return;
  }
  // Save current state to old active tab first
  syncTabFromState();
  // New tab starts at Genesis 1 in current translation
  TABS_R.push({ bi: 0, ch: 1, tr: S.tr });
  ACTIVE_TAB = TABS_R.length - 1;
  S.bi = 0; S.ch = 1;
  persistTabs();
  renderTabsBar();
  loadChapter();
}

function switchTab(i) {
  if (i === ACTIVE_TAB || i < 0 || i >= TABS_R.length) return;
  syncTabFromState(); // save current position
  ACTIVE_TAB = i;
  var t = TABS_R[i];
  S.bi = t.bi; S.ch = t.ch; S.tr = t.tr;
  persistTabs();
  renderTabsBar();
  loadChapter();
}

function closeTab(i) {
  if (TABS_R.length <= 1) return; // never close last
  var wasActive = i === ACTIVE_TAB;
  TABS_R.splice(i, 1);
  if (ACTIVE_TAB >= TABS_R.length) ACTIVE_TAB = TABS_R.length - 1;
  else if (i < ACTIVE_TAB) ACTIVE_TAB--;
  persistTabs();
  if (wasActive) {
    var t = TABS_R[ACTIVE_TAB];
    S.bi = t.bi; S.ch = t.ch; S.tr = t.tr;
    renderTabsBar();
    loadChapter();
  } else {
    renderTabsBar();
  }
}

var _loading = false;
async function loadChapter() {
  if (_loading) return;
  _loading = true;
  closeVA();
  syncTabFromState();
  renderTabsBar();
  persist();
  updateBar();
  // reset bar visibility on chapter change
  document.getElementById("top-bar").classList.remove("bar-hidden");
  document.getElementById("bot-nav").classList.remove("nav-hidden");
  document.getElementById("screen-bible").classList.remove("bar-hidden");
  var tb2 = document.getElementById("tabs-bar");
  if (tb2) tb2.classList.remove("bar-hidden");

  var ct = document.getElementById("ch-text");
  var lm = document.getElementById("loading-msg");
  var em = document.getElementById("error-msg");
  ct.innerHTML = "";
  em.style.display = "none";
  lm.style.display = "block";
  lm.textContent = "\u0417\u0430\u0433\u0440\u0443\u0437\u043a\u0430...";
  document.getElementById("screen-bible").scrollTop = 0;

  var bi = S.bi, ch = S.ch, tr = S.tr;
  var cached = getCache(tr, bi, ch);
  if (cached) {
    lm.style.display = "none";
    renderVerses(cached);
    loadGenevaNotes(bi, ch);
    _loading = false;
    return;
  }

  // bolls.life: GET /get-chapter/{translation}/{book_1based}/{chapter}/
  // Returns: [{verse:1, text:"..."}, ...]
  var url = "https://bolls.life/get-chapter/" + tr + "/" + (bi + 1) + "/" + ch + "/";
  try {
    var resp = await fetch(url);
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    var verses = await resp.json();
    if (!Array.isArray(verses) || verses.length === 0) throw new Error("empty");
    setCache(tr, bi, ch, verses);
    lm.style.display = "none";
    renderVerses(verses);
    loadGenevaNotes(bi, ch);
  } catch(e) {

  }
  _loading = false;
}

function renderVerses(verses) {
  var ct = document.getElementById("ch-text");
  ct.style.fontSize = S.fs + "px";
  ct.style.textAlign = S.align;
  applyTypography();
  var html = "";
  for (var i = 0; i < verses.length; i++) {
    var v = verses[i];
    var vn = v.verse;
    var txt = (v.text || "")
      .replace(/<br\s*\/?>/gi, " ")
      .replace(/<\/?[a-z][^>]*>/gi, "")
      .replace(/\s+/g, " ")
      .trim();
    var hk = hlKey(S.bi, S.ch, vn);
    var hlColor = HL[hk];
    var hlCls = hlColor ? " hld" : "";
    var hlStyle = hlColor ? ' style="background:' + hexToRgba(hlColor, 0.42) + '"' : '';
    html += '<span class="verse' + hlCls + '" data-v="' + vn + '"' + hlStyle + '>' +
            '<sup>' + vn + '</sup>' + esc(txt) + ' </span>';
  }
  ct.innerHTML = html;

  var items = ct.querySelectorAll(".verse");
  for (var j = 0; j < items.length; j++) {
    (function(el) {
      el.addEventListener("click", function() { selectVerse(el); });
    })(items[j]);
  }
}

function goPrev() {
  if (S.ch > 1) { S.ch--; }
  else if (S.bi > 0) { S.bi--; S.ch = bkChs(S.bi); }
  loadChapter();
}
function goNext() {
  if (S.ch < bkChs(S.bi)) { S.ch++; }
  else if (S.bi < BOOKS.length - 1) { S.bi++; S.ch = 1; }
  loadChapter();
}

// swipe
(function() {
  var sx = 0, sy = 0;
  var el = document.getElementById("screen-bible");
  el.addEventListener("touchstart", function(e) {
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
  }, {passive:true});
  el.addEventListener("touchend", function(e) {
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.4) {
      if (dx < 0) goNext(); else goPrev();
    }
  }, {passive:true});
})();

// ── Mark read on scroll to bottom ──
// ── + smart hide/show top bar & bottom nav ──
(function() {
  var el = document.getElementById("screen-bible");
  var topBar = document.getElementById("top-bar");
  var botNav = document.getElementById("bot-nav");
  var lastY = 0;
  var ticking = false;
  var THRESHOLD = 6; // px минимум чтобы среагировать

  var _markedThisVisit = "";
  el.addEventListener("scroll", function() {
    // mark read (only once per chapter visit)
    var visitKey = S.bi + "_" + S.ch;
    if (_markedThisVisit !== visitKey) {
      var remaining = el.scrollHeight - el.scrollTop - el.clientHeight;
      if (remaining <= 60) {
        markRead(S.bi, S.ch);
        _markedThisVisit = visitKey;
      }
    }

    // update chapter progress bar
    var max = el.scrollHeight - el.clientHeight;
    var pct = max > 0 ? Math.min(100, (el.scrollTop / max) * 100) : 0;
    var pb = document.getElementById("ch-progress");
    if (pb) pb.style.width = pct + "%";

    // hide/show bars
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(function() {
        var y = el.scrollTop;
        var dy = y - lastY;
        if (Math.abs(dy) > THRESHOLD) {
          var tbar = document.getElementById("tabs-bar");
          if (dy > 0 && y > 60) {
            // scrolling DOWN — hide
            topBar.classList.add("bar-hidden");
            botNav.classList.add("nav-hidden");
            el.classList.add("bar-hidden");
            if (tbar) tbar.classList.add("bar-hidden");
          } else {
            // scrolling UP — show
            topBar.classList.remove("bar-hidden");
            botNav.classList.remove("nav-hidden");
            el.classList.remove("bar-hidden");
            if (tbar) tbar.classList.remove("bar-hidden");
          }
          lastY = y;
        }
        ticking = false;
      });
    }
  }, {passive: true});
})();
function setFontSize(v) {
  S.fs = parseInt(v, 10);

function setAlign(a) {

    var b = document.getElementById(ids[i]);

function applyTypography() {

function markRead(bi, ch) {
  var k = bi + "_" + ch;
  if (!READ[k]) {
    READ[k] = true;
    persistRD();
  }
  var today = getToday();
  if (!DAILY[today]) DAILY[today] = [];
  if (DAILY[today].indexOf(k) === -1) {
    DAILY[today].push(k);
    persistDAILY();
  }
}
function bookProgress(bi) {
  var total = bkChs(bi);
  var done = 0;
  for (var c = 1; c <= total; c++) {
    if (READ[bi + "_" + c]) done++;
  }
  return { done: done, total: total };
}
function progressRingSVG(pct, done) {
  var r = 14; var cx = 19; var cy = 19;
  var circ = 2 * 3.14159 * r;
  var offset = circ * (1 - pct / 100);
  var lbl = done ? "&#x2713;" : (pct + "%");
  var lblCls = done ? " done" : "";
  return '<div class="bk-ring">' +
    '<svg viewBox="0 0 38 38">' +
      '<circle class="bk-ring-track" cx="' + cx + '" cy="' + cy + '" r="' + r + '"/>' +
      '<circle class="bk-ring-fill" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' +
        ' stroke-dasharray="' + circ.toFixed(2) + ' ' + circ.toFixed(2) + '"' +
        ' stroke-dashoffset="' + offset.toFixed(2) + '"/>' +
    '</svg>' +
    '<div class="bk-ring-lbl' + lblCls + '">' + lbl + '</div>' +
    '</div>';
}

function renderBookList(filter) {
  var fl = filter.toLowerCase();
  var list = document.getElementById("bk-list");
  var html = "";
  var addedNT = false;
  for (var i = 0; i < BOOKS.length; i++) {
    var name = BOOKS[i][0];
    var nameEn = BOOKS_EN[i];
    if (fl && name.toLowerCase().indexOf(fl) === -1 &&
        nameEn.toLowerCase().indexOf(fl) === -1) continue;
    if (!fl) {
      if (i === 0) html += '<div class="test-lbl">' + (isEn() ? "Old Testament" : "\u0412\u0435\u0442\u0445\u0438\u0439 \u0417\u0430\u0432\u0435\u0442") + '</div>';
      if (i === OT_END + 1 && !addedNT) {
        html += '<div class="test-lbl">' + (isEn() ? "New Testament" : "\u041d\u043e\u0432\u044b\u0439 \u0417\u0430\u0432\u0435\u0442") + '</div>';
        addedNT = true;
      }
    }
    var cur = i === S.bi ? " cur" : "";
    var prog = bookProgress(i);
    var pct = prog.total > 0 ? Math.round(prog.done * 100 / prog.total) : 0;
    var isDone = prog.total > 0 && prog.done >= prog.total;
    var ringHtml = progressRingSVG(pct, isDone);
    var dispName = bkName(i);
    html += '<button class="bk-item' + cur + '" onclick="pickBook(' + i + ')">' +
            '<span class="bk-name">' + dispName + '</span>' +
            '<span class="bk-chs">' + prog.total + '</span>' +
            ringHtml +
            '</button>';
  }
  list.innerHTML = html;
}

// ─── VERSE ACTIONS ───────────────────────────────
var _vaOpen = false;

function selectVerse(el) {
  var vn = parseInt(el.getAttribute("data-v"), 10);

  if (!_vaOpen) {
    S.sel = el; S.selN = vn; S.sels = {}; S.sels[vn] = el;
    el.classList.add("sel");
    _vaOpen = true;
    updateVARef();
    initColorDots();
    refreshGenevaButton();
    document.getElementById("va").classList.add("open");
  } else {
    // Sheet already open — toggle verse in selection
    if (S.sels[vn]) {
      // Deselect
      el.classList.remove("sel");
      delete S.sels[vn];
      if (Object.keys(S.sels).length === 0) { closeVA(); return; }
      // Update primary if removed
      if (vn === S.selN) {
        var remaining = Object.keys(S.sels);
        S.selN = parseInt(remaining[0], 10);
        S.sel = S.sels[S.selN];
      }
    } else {
      // Add to selection
      el.classList.add("sel");
      S.sels[vn] = el;
    }
    updateVARef();
  }
}

function updateVARef() {
  var keys = Object.keys(S.sels);
  var count = keys.length;
  document.getElementById("va-ref").textContent = bkName(S.bi) + " " + S.ch + ":" + S.selN;
  var cnt = document.getElementById("va-count");
  if (count > 1) {
    cnt.textContent = count + " \u0441\u0442\u0438\u0445\u0430";
    cnt.style.display = "";
  } else {
    cnt.style.display = "none";
  }
}

function initColorDots() {
  var row = document.getElementById("hl-colors-row");
  var pickBtn = row.querySelector(".hl-pick-btn");
  // Remove old dots (keep pick button)
  var old = row.querySelectorAll(".hl-dot");
  for (var i = 0; i < old.length; i++) old[i].parentNode.removeChild(old[i]);
  // Add dots for each color
  var firstHl = HL[hlKey(S.bi, S.ch, S.selN)];
  for (var ci = 0; ci < COLORS.length; ci++) {
    (function(hex) {
      var btn = document.createElement("button");
      btn.className = "hl-dot" + (firstHl === hex ? " on" : "");
      btn.style.background = hex;
      btn.setAttribute("data-hex", hex);
      btn.style.boxShadow = hex === '#FFFFFF' || hex === '#AAAAAA' ? '0 0 0 1px var(--border)' : '';
      btn.onclick = function() { hlVerse(hex); };
      row.insertBefore(btn, pickBtn);
    })(COLORS[ci]);
  }
}

function closeVA() {
  _vaOpen = false;
  document.getElementById("va").classList.remove("open");
  var wrap = document.getElementById("va-slider-wrap");
  if (wrap) wrap.scrollLeft = 0;
  var keys = Object.keys(S.sels);
  for (var i = 0; i < keys.length; i++) {
    if (S.sels[keys[i]]) S.sels[keys[i]].classList.remove("sel");
  }
  S.sel = null; S.selN = 0; S.sels = {};
  document.getElementById("va-count").style.display = "none";
}

function applyHLStyle(el, hex) {
  el.style.backgroundColor = hexToRgba(hex, 0.42);
  el.classList.add("hld");
}
function removeHLStyle(el) {
  el.style.removeProperty("background-color");
  el.style.removeProperty("background");
  el.classList.remove("hld");
}

function hlVerse(hex) {
  var keys = Object.keys(S.sels);
  for (var i = 0; i < keys.length; i++) {
    var vn = parseInt(keys[i], 10);
    var el = S.sels[vn];
    if (!el) continue;
    applyHLStyle(el, hex);
    HL[hlKey(S.bi, S.ch, vn)] = hex;
  }
  persistHL();
  // Update dot states - dots have data-hex
  var dots = document.querySelectorAll(".hl-dot");
  for (var d = 0; d < dots.length; d++) {
    dots[d].classList.toggle("on", dots[d].getAttribute("data-hex") === hex);
  }
}

function clrHL() {
  var keys = Object.keys(S.sels);
  for (var i = 0; i < keys.length; i++) {
    var vn = parseInt(keys[i], 10);
    var el = S.sels[vn];
    if (!el) continue;
    removeHLStyle(el);
    delete HL[hlKey(S.bi, S.ch, vn)];
  }
  persistHL();
  var dots = document.querySelectorAll(".hl-dot");
  for (var d = 0; d < dots.length; d++) dots[d].classList.remove("on");
  closeVA();
}
function getVerseText() {
  if (!S.sel) return "";
  // textContent includes the verse number from <sup>, remove it
  var clone = S.sel.cloneNode(true);
  var sups = clone.querySelectorAll("sup");
  for (var i = 0; i < sups.length; i++) sups[i].remove();
  return (clone.textContent || "").trim();
}
function getVerseRef() {
  return bkName(S.bi) + " " + S.ch + ":" + S.selN;
}
function copyVerse() {
  var txt = getVerseText() + " \u2014 " + getVerseRef();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function() {
      showToast("\u0421\u043a\u043e\u043f\u0438\u0440\u043e\u0432\u0430\u043d\u043e");
    }, function() {
      showToast("\u041e\u0448\u0438\u0431\u043a\u0430");
    });
  } else {
    showToast("\u041e\u0448\u0438\u0431\u043a\u0430");
  }
  closeVA();
}
function shareVerse() {
  var txt = getVerseText() + " \u2014 " + getVerseRef();
  if (navigator.share) {
    navigator.share({ text: txt }).catch(function() {
      // user cancelled or error - silent
    });
  } else {
    copyVerse(); return;
  }
  closeVA();
}
function saveVerse() {
  var ref = getVerseRef();
  var txt = getVerseText();
  // avoid duplicates
  for (var i = 0; i < SAVED.length; i++) {
    if (SAVED[i].ref === ref) {
      showToast("\u0423\u0436\u0435 \u0441\u043e\u0445\u0440\u0430\u043d\u0435\u043d\u043e");
      closeVA(); return;
    }
  }
  SAVED.unshift({ ref: ref, text: txt });
  persistSV();
  showToast(ref + " \u2014 \u0441\u043e\u0445\u0440\u0430\u043d\u0435\u043d\u043e");
  closeVA();
}

// ═══════════════════════════════════════════════
// SEARCH SCREEN
// ═══════════════════════════════════════════════
function openSearch() { showTab("search"); }
function doSearch() {
  var q = document.getElementById("search-input").value.trim().toLowerCase();
  if (q.length < 2) { return; }
  var hint = document.getElementById("search-hint");
  var results = document.getElementById("search-results");
  hint.textContent = "\u041f\u043e\u0438\u0441\u043a \u0432 \u0437\u0430\u0433\u0440\u0443\u0436\u0435\u043d\u043d\u044b\u0445 \u0433\u043b\u0430\u0432\u0430\u0445...";
  results.innerHTML = "";
  // Search all cached chapters
  var found = [];
  var keys = [];
  try {
    for (var k = 0; k < localStorage.length; k++) {
      var key = localStorage.key(k);
      if (key && key.indexOf("bbl_c_") === 0) keys.push(key);
    }
  } catch(e) {}
  for (var ki = 0; ki < keys.length; ki++) {
    try {
      var raw = localStorage.getItem(keys[ki]);
      if (!raw) continue;
      var verses = JSON.parse(raw);
      // parse key: bbl_c_{tr}_{bi}_{ch}
      var parts = keys[ki].split("_");
      var tr2 = parts[2];
      var bi2 = parseInt(parts[3], 10);
      var ch2 = parseInt(parts[4], 10);
      if (isNaN(bi2) || isNaN(ch2)) continue;
      if (tr2 !== S.tr) continue;
      for (var vi = 0; vi < verses.length; vi++) {
        var vt = (verses[vi].text || "").toLowerCase();
        if (vt.indexOf(q) !== -1) {
          found.push({
            bi: bi2, ch: ch2,
            vn: verses[vi].verse,
            text: verses[vi].text || ""
          });
          if (found.length >= 50) { ki = keys.length; break; }
        }
      }
    } catch(e2) {}
  }
  if (found.length === 0) {
    hint.textContent = "\u041d\u0435\u0442 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u043e\u0432 \u0432 \u0437\u0430\u0433\u0440\u0443\u0436\u0435\u043d\u043d\u044b\u0445 \u0433\u043b\u0430\u0432\u0430\u0445";
    return;
  }
  hint.textContent = "";
  var re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "gi");
  var html = "";
  for (var fi = 0; fi < found.length; fi++) {
    var f = found[fi];
    var ref = bkName(f.bi) + " " + f.ch + ":" + f.vn;
    var hiTxt = esc(f.text).replace(re, "<em>$1</em>");
    html += '<div class="s-result" onclick="goToVerse(' + f.bi + ',' + f.ch + ',' + f.vn + ')">' +
            '<div class="s-result-ref">' + esc(ref) + '</div>' +
            '<div class="s-result-text">' + hiTxt + '</div>' +
            '</div>';
  }
  results.innerHTML = html;
}

// GENEVA NOTES
// ═══════════════════════════════════════════════
function genevaKey(bi, ch) { return "gbbl_" + bi + "_" + ch; }
var _gToken = 0;

async function loadGenevaNotes(bi, ch) {
  if (_gBi === bi && _gCh === ch && _gLoaded) return;
  _gNotes = {}; _gLoaded = false; _gBi = bi; _gCh = ch;
  var myToken = ++_gToken;

  // cache first
  try {
    var c = localStorage.getItem(genevaKey(bi, ch));
    if (c) {
      _gNotes = JSON.parse(c); _gLoaded = true;
      refreshGenevaButton();
      return;
    }
  } catch(e) {}

  var bbyNum = BBY_MAP[bi];
  if (!bbyNum) { _gLoaded = true; refreshGenevaButton(); return; }
  var rawUrl = "https://bible.by/geneva-bible/" + bbyNum + "/" + ch + "/";
  var proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(rawUrl);

  try {
    var resp = await fetch(proxyUrl);
    // discard if user moved to another chapter
    if (myToken !== _gToken) return;
    if (!resp.ok) throw new Error("proxy " + resp.status);
    var html = await resp.text();
    if (myToken !== _gToken) return;

    var parser = new DOMParser();
    var doc = parser.parseFromString(html, "text/html");

    // find content paragraphs — bible.by puts notes in <p> with <strong>
    var paras = doc.querySelectorAll("p");
    var notes = {};   // {verseNum: string[]}
    var curV = null;

    var verseRef = new RegExp("^" + ch + ":(\\d+)");

    for (var i = 0; i < paras.length; i++) {
      var p = paras[i];
      var strongs = p.querySelectorAll("strong");
      if (!strongs.length) continue;

      var firstStrong = strongs[0].textContent || "";
      var m = firstStrong.match(verseRef);

      if (m) {
        // new verse reference found
        curV = parseInt(m[1], 10);
        // handle range like "1:3−4" or "1:3-4"
        var rangeM = firstStrong.match(new RegExp("^" + ch + ":(\\d+)[\\u2212\\-](\\d+)"));
        var endV = rangeM ? parseInt(rangeM[2], 10) : curV;

        var txt = buildNoteHTML(p);
        for (var v = curV; v <= endV; v++) {
          if (!notes[v]) notes[v] = [];
          notes[v].push(txt);
        }
      } else if (curV !== null) {
        // continuation note under same verse
        var txt2 = buildNoteHTML(p);
        if (txt2.trim()) {
          if (!notes[curV]) notes[curV] = [];
          notes[curV].push(txt2);
        }
      }
    }

    _gNotes = notes;
    _gLoaded = true;
    try { localStorage.setItem(genevaKey(bi, ch), JSON.stringify(notes)); } catch(e2) {}
    refreshGenevaButton();
  } catch(err) {
    _gLoaded = true; // give up; mark as loaded so button doesn't keep showing
    console.error("Geneva:", err);
    refreshGenevaButton();
  }
}

function refreshGenevaButton() {
  if (!S.sel) return;
  var gnBtn = document.getElementById("va-gn-btn");
  if (!gnBtn) return;
  var hasNote = _gLoaded && _gNotes[S.selN] && _gNotes[S.selN].length > 0;
  gnBtn.style.display = hasNote ? "" : "none";
}

function buildNoteHTML(p) {
  // Convert paragraph to HTML preserving <strong> bold
  var html = "";
  var nodes = p.childNodes;
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    if (n.nodeType === 3) { // text node
      html += esc(n.textContent || "");
    } else if (n.nodeType === 1 && n.tagName === "STRONG") {
      html += "<strong>" + esc(n.textContent || "") + "</strong>";
    } else if (n.nodeType === 1) {
      html += esc(n.textContent || "");
    }
  }
  return html.trim();
}

function openGenevaNote() {
  if (!S.sel) return;
  var vn = S.selN;
  var ref = bkName(S.bi) + " " + S.ch + ":" + vn;
  document.getElementById("gn-title").textContent = ref;
  document.getElementById("gn-ov").classList.add("open");
  document.body.classList.add("modal-open");
  renderGenevaNote(vn);
  closeVA();
}

function renderGenevaNote(vn) {
  var body = document.getElementById("gn-body");
  var parts = _gNotes[vn];
  if (!parts || !parts.length) {
    body.innerHTML = '<p style="color:var(--text2);font-size:15px;">\u0417\u0430\u043c\u0435\u0442\u043e\u043a \u0434\u043b\u044f \u044d\u0442\u043e\u0433\u043e \u0441\u0442\u0438\u0445\u0430 \u043d\u0435\u0442.</p>';
    return;
  }
  var html = "";
  for (var i = 0; i < parts.length; i++) {
    html += '<div class="gn-note">' + parts[i] + '</div>';
  }
  body.innerHTML = html;
}

  document.getElementById("gn-ov").classList.remove("open");
  document.body.classList.remove("modal-open");
}

var MONTHS_RU = [

  "\u041e\u043a\u0442\u044f\u0431\u0440\u044c","\u041d\u043e\u044f\u0431\u0440\u044c","\u0414\u0435\u043a\u0430\u0431\u0440\u044c"
];

function dateStr(d) {
  var mm = String(d.getMonth() + 1).padStart(2,"0");
  var dd2 = String(d.getDate()).padStart(2,"0");
  return d.getFullYear() + "-" + mm + "-" + dd2;
}

function calcStreak() {
  var streak = 0;
  var d = new Date();
  // if not read today, start from yesterday
  var todayStr = getToday();
  if (!DAILY[todayStr] || !DAILY[todayStr].length) {
    d.setDate(d.getDate() - 1);
  }
  for (var i = 0; i < 3650; i++) {
    var s = dateStr(d);
    if (DAILY[s] && DAILY[s].length > 0) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else { break; }
  }
  return streak;
}

function calcTotalDays() {
  var count = 0;
  var keys = Object.keys(DAILY);
  for (var i = 0; i < keys.length; i++) {
    if (DAILY[keys[i]] && DAILY[keys[i]].length > 0) count++;
  }
  return count;
}

function calcTotalChapters() {
  var count = 0;
  var keys = Object.keys(DAILY);
  for (var i = 0; i < keys.length; i++) {
    count += (DAILY[keys[i]] || []).length;
  }
  return count;
}

function renderStats() {
  // Always reset to current month on tab visit
  _statMonth = new Date();
  _statMonth.setDate(1);
  _statMonth.setHours(0,0,0,0);
  doRenderStats();
}

function doRenderStats() {
  renderRecentChapters();
  // Summary
  var streak = calcStreak();
  var totalDays = calcTotalDays();
  var totalCh = calcTotalChapters();
  document.getElementById("st-summary").innerHTML =
    '<div class="st-stat"><div class="st-val">' + streak + '</div><div class="st-lbl">\u0414\u043d\u0435\u0439 \u043f\u043e\u0434\u0440\u044f\u0434</div></div>' +
    '<div class="st-stat"><div class="st-val">' + totalCh + '</div><div class="st-lbl">\u0413\u043b\u0430\u0432 \u043f\u0440\u043e\u0447\u0438\u0442\u0430\u043d\u043e</div></div>' +
    '<div class="st-stat"><div class="st-val">' + totalDays + '</div><div class="st-lbl">\u0414\u043d\u0435\u0439 \u0447\u0442\u0435\u043d\u0438\u044f</div></div>';

  // Month title
  document.getElementById("st-month-title").textContent =
    MONTHS_RU[_statMonth.getMonth()] + " " + _statMonth.getFullYear();

  // Prev/next buttons
  var now = new Date();
  now.setDate(1); now.setHours(0,0,0,0);
  document.getElementById("st-next").disabled =
    _statMonth.getFullYear() === now.getFullYear() && _statMonth.getMonth() === now.getMonth();

  // Build calendar
  var today = getToday();
  var year = _statMonth.getFullYear();
  var month = _statMonth.getMonth();
  var firstDay = new Date(year, month, 1);
  // Monday=0 offset
  var startDow = (firstDay.getDay() + 6) % 7; // Mon=0..Sun=6
  var daysInMonth = new Date(year, month + 1, 0).getDate();

  var html = "";
  var totalCells = Math.ceil((startDow + daysInMonth) / 7) * 7;

  html += '<div class="cal-week">';
  for (var cell = 0; cell < totalCells; cell++) {
    if (cell > 0 && cell % 7 === 0) html += '</div><div class="cal-week">';
    var dayNum = cell - startDow + 1;
    if (dayNum < 1 || dayNum > daysInMonth) {
      html += '<div class="cal-day empty"></div>';
    } else {
      var mm2 = String(month + 1).padStart(2,"0");
      var dd3 = String(dayNum).padStart(2,"0");
      var ds = year + "-" + mm2 + "-" + dd3;
      var cnt = DAILY[ds] ? DAILY[ds].length : 0;
      var rdCls = cnt === 0 ? "rd0" : cnt === 1 ? "rd1" : cnt <= 3 ? "rd2" : cnt <= 5 ? "rd3" : "rd4";
      var todayCls = ds === today ? " today" : "";
      html += '<div class="cal-day ' + rdCls + todayCls + '" onclick="openDayDetail(\'' + ds + '\')">' +
              '<span class="cal-day-num">' + dayNum + '</span>' +
              (cnt > 0 ? '<span class="cal-day-dot"></span>' : '') +
              '</div>';
    }
  }
  html += '</div>';
  document.getElementById("cal-weeks").innerHTML = html;
}

function drawCPCanvas() {
  var canvas = document.getElementById("cp-canvas");
  if (!canvas) return;
  var w = canvas.offsetWidth || 280;
  canvas.width = w; canvas.height = 160;
  var ctx = canvas.getContext("2d");
  var gH = ctx.createLinearGradient(0,0,w,0);
  gH.addColorStop(0, "#fff");
  gH.addColorStop(1, "hsl("+Math.round(_cp.h*360)+",100%,50%)");
  ctx.fillStyle = gH; ctx.fillRect(0,0,w,160);
  var gV = ctx.createLinearGradient(0,0,0,160);
  gV.addColorStop(0,"rgba(0,0,0,0)"); gV.addColorStop(1,"#000");
  ctx.fillStyle = gV; ctx.fillRect(0,0,w,160);
  var cx = _cp.s * w, cy = (1-_cp.v) * 160;
  ctx.beginPath(); ctx.arc(cx,cy,9,0,Math.PI*2);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,9,0,Math.PI*2);
  ctx.strokeStyle = "rgba(0,0,0,0.4)"; ctx.lineWidth = 1; ctx.stroke();
}
function drawHueCanvas() {
  var canvas = document.getElementById("cp-hue");
  if (!canvas) return;
  var w = canvas.offsetWidth || 280;
  canvas.width = w; canvas.height = 22;
  var ctx = canvas.getContext("2d");
  var g = ctx.createLinearGradient(0,0,w,0);
  for (var i = 0; i <= 6; i++) g.addColorStop(i/6,"hsl("+(i*60)+",100%,50%)");
  ctx.fillStyle = g; ctx.fillRect(0,0,w,22);
  var hx = _cp.h * w;
  ctx.beginPath(); ctx.arc(hx,11,8,0,Math.PI*2);
  ctx.strokeStyle="#fff"; ctx.lineWidth=2.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(hx,11,8,0,Math.PI*2);
  ctx.strokeStyle="rgba(0,0,0,0.3)"; ctx.lineWidth=1; ctx.stroke();
}
function updateCPSwatch() {
  _cp.hex = hsvToHex(_cp.h, _cp.s, _cp.v);
  var sw = document.getElementById("cp-swatch");
  if (sw) sw.style.background = _cp.hex;
}
function cpPos(canvas, e) {
  var rect = canvas.getBoundingClientRect();
  var cx2 = e.touches ? e.touches[0].clientX : e.clientX;
  var cy2 = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: Math.max(0,Math.min(1,(cx2-rect.left)/rect.width)),
    y: Math.max(0,Math.min(1,(cy2-rect.top)/rect.height))
  };
}
(function() {

    sv.addEventListener("touchstart",function(e){_cpDragging=true;onSV(e);},{passive:true});
    sv.addEventListener("touchmove",function(e){onSV(e);},{passive:true});

function getRecentChapters(n) {
  var entries = [];
  var dkeys = Object.keys(DAILY).sort().reverse();
  for (var i = 0; i < dkeys.length && entries.length < n; i++) {
    var day = DAILY[dkeys[i]];
    for (var j = day.length-1; j >= 0 && entries.length < n; j--) {
      entries.push({ k: day[j], date: dkeys[i] });
    }
  }
  return entries;
}
function formatShortDate(ds) {
  var parts = ds.split("-");
  var d2 = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
  if (ds === getToday()) return "\u0421\u0435\u0433\u043e\u0434\u043d\u044f";
  var yest = new Date(); yest.setDate(yest.getDate()-1);
  if (ds === dateStr(yest)) return "\u0412\u0447\u0435\u0440\u0430";
  return d2.getDate() + " " + MONTHS_RU[d2.getMonth()];
}

    { ovId: "gn-ov",    closeId: null, closeFn: "closeGN" }
  ];

  SHEETS.forEach(function(cfg) {
    var ov = document.getElementById(cfg.ovId);
    if (!ov) return;
    var sheet = ov.querySelector(".sheet, #dd-sheet, #gn-sheet");
    if (!sheet) return;

    var startY = 0;
    var currentY = 0;
    var dragging = false;

    sheet.addEventListener("touchstart", function(e) {
      // only start drag from handle area or top 40px of sheet
      var touch = e.touches[0];
      var rect = sheet.getBoundingClientRect();
      if (touch.clientY - rect.top > 60) return; // too far down
      startY = touch.clientY;
      currentY = 0;
      dragging = true;
      sheet.style.transition = "none";
    }, {passive: true});

    sheet.addEventListener("touchmove", function(e) {
      if (!dragging) return;
      var dy = e.touches[0].clientY - startY;
      if (dy < 0) { sheet.style.transform = ""; return; }
      currentY = dy;
      sheet.style.transform = "translateY(" + dy + "px)";
    }, {passive: true});

    sheet.addEventListener("touchend", function() {
      if (!dragging) return;
      dragging = false;
      sheet.style.transition = "";
      if (currentY > 80) {
        // dismiss
        sheet.style.transform = "translateY(100%)";
        setTimeout(function() {
          sheet.style.transform = "";
          if (cfg.closeFn) window[cfg.closeFn]();
          else closeOv(cfg.closeId);
        }, 220);
      } else {
        // snap back
        sheet.style.transform = "";
      }
    }, {passive: true});
  });
})();
document.getElementById("top-bar").addEventListener("dblclick", function(e) {
  // ignore clicks on buttons
  if (e.target.closest("button")) return;
  var el = document.getElementById("screen-bible");
  el.scrollTo({ top: 0, behavior: "smooth" });
});

// THEME
// ═══════════════════════════════════════════════
function applyTheme(t) {
  S.theme = t;
  if (t === "light") {
    document.documentElement.setAttribute("data-theme","light");
  } else {
    document.documentElement.removeAttribute("data-theme");
  }
  // update status bar color
  var tc = document.getElementById("theme-color-meta");
  if (tc) tc.setAttribute("content", t === "light" ? "#ffffff" : "#000000");
  var icon = document.getElementById("theme-icon");
  if (icon) {
    if (t === "light") {
      icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
    } else {
      icon.innerHTML = '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
    }
  }
  persist();
}
function toggleTheme() {
  applyTheme(S.theme === "dark" ? "light" : "dark");
}
